# ==============================================================================
# NewsLens Configuration File
# ==============================================================================

# Natural Language Processing & Sentiment Model Settings
nlp:
  spacy_model: "en_core_web_sm"
  sentiment_model: "distilbert-base-uncased-finetuned-sst-2-english"
  use_fast_vader_only: true  # Set to true for sub-second execution (bypasses DistilBERT)

# Feature Extraction & Analysis Parameters
analysis:
  top_tf_idf_terms: 10
  max_text_length: 5000

# Large Language Model (LLM) Integration
llm:
  provider: "openai"
  model: "gpt-3.5-turbo"
  temperature: 0.3
  max_tokens: 500

# UI & Application Settings
app:
  title: "NewsLens: Media Bias & Sentiment Analyzer"
  theme: "light"